name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} must equal {expected!r}")

          heading = f"## [{version}]"
          lines = Path("CHANGELOG.md").read_text().splitlines()
          matches = [index for index, line in enumerate(lines) if line.startswith(heading)]
          if len(matches) != 1:
              raise SystemExit(f"CHANGELOG.md must contain exactly one {heading!r} section")
          start = matches[0] + 1
          end = next(
              (index for index in range(start, len(lines)) if lines[index].startswith("## [")),
              len(lines),
          )
          if not "\n".join(lines[start:end]).strip():
              raise SystemExit(f"CHANGELOG.md section {heading!r} is empty")
          print(f"Validated {actual} and CHANGELOG.md")
          PY

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Verify generated Function
        run: |
          uv run python scripts/build.py --check
          uv run python -m compileall -q src scripts tests dist/google_agent_platform.py

  release:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare release notes
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          heading = f"## [{version}]"
          lines = Path("CHANGELOG.md").read_text().splitlines()
          start = next(index for index, line in enumerate(lines) if line.startswith(heading)) + 1
          end = next(
              (
                  index
                  for index in range(start, len(lines))
                  if lines[index].startswith("## [")
                  or re.match(r"^\[[^]]+\]:\s", lines[index])
              ),
              len(lines),
          )
          notes = "\n".join(lines[start:end]).strip()
          Path("release-notes.md").write_text(f"{notes}\n")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/google_agent_platform.py \
            --verify-tag \
            --notes-file release-notes.md \
            --title "$GITHUB_REF_NAME"
