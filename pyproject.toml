[project]
name = "google-agent-platform-pipe"
version = "0.4.1"
description = "Google Agent Platform Pipe for Open WebUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
